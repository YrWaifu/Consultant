<!-- Верхняя полоса: логотип, поиск, аватар -->
<div class="bg-white">
    <div class="container mx-auto px-8 lg:px-10">
        <div class="flex items-center justify-between gap-4 py-3">
            <!-- Лого -->
            <a href="{{ url_for('web_v2_check') }}" class="flex items-center gap-2 shrink-0">
                <div class="h-10 w-10 rounded-full bg-cyan-400 flex items-center justify-center text-white text-lg">📃
                </div>
                <span class="hidden sm:block font-semibold">РекВизор</span>
            </a>

            <!-- Поиск сверху -->
            <div class="flex-1 max-w-2xl">
                {% include 'components/search_bar.html' with context %}
            </div>

            <!-- Авторизация -->
            <div class="shrink-0">
                {% if current_user %}
                    <!-- Меню авторизованного пользователя -->
                    <div class="relative group">
                        <a href="{{ url_for('web_v2_account_subscription') }}" class="inline-flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-neutral-100 cursor-pointer">
                            <span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-cyan-400 text-white text-sm font-medium">
                                {{ current_user.email[0].upper() }}
                            </span>
                            <span class="hidden sm:block text-sm font-medium">{{ current_user.email }}</span>
                        </a>

                        <!-- Выпадающее меню с перекрытием для плавного перехода -->
                        <div class="absolute right-0 top-full pt-1 hidden group-hover:block z-50">
                            <div class="w-48 bg-white rounded-lg shadow-lg border border-neutral-200 py-1">
                                <a href="{{ url_for('web_v2_account_subscription') }}" class="block px-4 py-2 text-sm text-neutral-700 hover:bg-neutral-50">
                                    Подписка
                                </a>
                                <a href="{{ url_for('web_v2_account_history') }}" class="block px-4 py-2 text-sm text-neutral-700 hover:bg-neutral-50">
                                    История проверок
                                </a>
                                <a href="{{ url_for('web_v2_account_stats') }}" class="block px-4 py-2 text-sm text-neutral-700 hover:bg-neutral-50">
                                    Статистика
                                </a>
                                <div class="border-t border-neutral-200 my-1"></div>
                                <a href="{{ url_for('web_v2_logout') }}" class="block px-4 py-2 text-sm text-red-600 hover:bg-neutral-50">
                                    Выйти
                                </a>
                            </div>
                        </div>
                    </div>
                {% else %}
                    <!-- Кнопки входа и регистрации -->
                    <div class="flex items-center gap-2">
                        <a href="{{ url_for('web_v2_login') }}" class="px-4 py-2 text-sm font-medium text-neutral-700 hover:text-neutral-900">
                            Войти
                        </a>
                        <a href="{{ url_for('web_v2_register') }}" class="px-4 py-2 text-sm font-medium bg-cyan-400 text-white rounded-full hover:bg-cyan-600">
                            Регистрация
                        </a>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>

<!-- Навигация: по центру по вертикали, подчёркивание активного -->
<nav class="bg-white border-b border-neutral-200">
    <div class="container mx-auto px-8 lg:px-10">
        <ul class="flex items-center justify-center h-12 gap-8 text-sm">
            <li>
                <a href="{{ url_for('web_v2_articles') }}"
                    class="inline-flex items-center h-full border-b-2 {{ 'border-cyan-600 text-cyan-600' if active=='articles' else 'border-transparent text-neutral-700 hover:text-neutral-900' }}">
                    Полезные статьи
                </a>
            </li>
            <li>
                <a href="{{ url_for('web_v2_check') }}"
                    class="inline-flex items-center h-full border-b-2 {{ 'border-cyan-600 text-cyan-600' if active=='check' else 'border-transparent text-neutral-700 hover:text-neutral-900' }}">
                    Проверка рекламы
                </a>
            </li>
            <li>
                <a href="{{ url_for('web_v2_laws') }}"
                    class="inline-flex items-center h-full border-b-2 {{ 'border-cyan-600 text-cyan-600' if active=='laws' else 'border-transparent text-neutral-700 hover:text-neutral-900' }}">
                    ФЗ «О рекламе»
                </a>
            </li>
        </ul>
    </div>
</nav>
