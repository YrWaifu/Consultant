<form action="{{ action or url_for('web_v2_search') }}" method="get" class="relative flex items-center">
    <input name="q" value="{{ request.query_params.get('q','') }}"
        placeholder="{{ placeholder or 'Поиск' }}"
        class="w-full h-11 rounded-full border border-neutral-300 pl-4 pr-28 outline-none focus:ring-2 focus:ring-cyan-200 focus:border-cyan-100 bg-white" />
    <button type="submit"
        class="absolute right-1.5 top-1.5 bottom-1.5 rounded-full px-4 text-sm bg-cyan-400 text-white hover:bg-cyan-500 flex items-center justify-center">
        Найти
    </button>
</form>
