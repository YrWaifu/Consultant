<article class="rounded-xl border border-rose-300/70 bg-white p-4 shadow-[0_0_0_1px_rgba(244,63,94,0.05)] hover:shadow-md transition-shadow">
    <div class="text-xs text-neutral-500 mb-2">
        {{format_date(article.created_at, format='d MMMM yyyy', locale='ru')}}
    </div>
    <h3 class="font-semibold leading-snug mb-2">
        <a href="{{ url_for('web_v2_article_detail', article_slug=article.slug) }}" 
           class="hover:text-rose-700 text-neutral-900">
            {{ article.title }}
        </a>
    </h3>
    {% if article.excerpt %}
    <p class="text-sm text-neutral-700 mb-3 line-clamp-3">
        {{ article.excerpt }}
    </p>
    {% endif %}
    <div class="flex items-center justify-between">
        <a href="{{ url_for('web_v2_article_detail', article_slug=article.slug) }}" 
           class="text-sm text-rose-600 hover:text-rose-700 font-medium">
            Читать полностью →
        </a>
        {% if article.view_count > 0 %}
        <span class="text-xs text-neutral-500">
            {{ article.view_count }} просмотров
        </span>
        {% endif %}
    </div>
</article>
